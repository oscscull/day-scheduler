# Mechanical settings only. Behaviour lives in prompts/ and schedules/.

# This machine's name. Each area below says which machine runs its schedules.
node = "work-mac"

# Start Bridge when you log in, so schedules and alerts keep working. Closing the window keeps
# it running in the menu bar; quit from there.
launch_at_login = true

# How many asks Today's Priorities section shows, taken from the top of the ranking.
priority_limit = 3

# How long something waits on reviewers before Today suggests nudging them.
nudge_after_hours = 24

# Command used to run Claude headlessly (`<command> -p "<prompt>"`).
claude_command = "claude"

# How long stored agent output lives before it is deleted.
activity_ttl_days = 7
run_ttl_days = 14
done_todo_ttl_days = 1
# Done work items, with their history, are deleted this long after they finish.
done_item_ttl_days = 30

# Areas of your life Bridge keeps apart. Everything belongs to one. Rename, recolour or add more.
# `node` is the machine that runs that area's schedules.
[[areas]]
id = "work"
name = "Work"
color = "#3b6fd8"
node = "work-mac"

[[areas]]
id = "projects"
name = "Projects"
color = "#8a5cc7"
node = "home-mac"

[[areas]]
id = "life"
name = "Life"
color = "#2e8a47"
node = "home-mac"

# Your open PRs become items, through the `gh` command's existing login. Bridge only rewrites a
# PR's title, stage and status when they change on GitHub, so your edits stick in between.
[github]
enabled = true
poll_minutes = 5
default_area = "work"
# Skip PRs from these owners or repos.
ignore = []
# Owners or repos where you review your own PRs. PRs with no requested reviewers already count.
self_review = []
# Bridge reads CI state from GitHub itself (no tokens). When CI finishes on an item Claude has
# claimed, Bridge tells that Claude session, so agents never poll CI. When CI fails on a PR nobody
# is on, and no ci_failed schedule covers it, Bridge hands it to Claude (prompts/fix-ci.md).
fix_ci = true
fix_ci_tools = ["Bash(gh pr checks:*)", "Bash(gh pr view:*)", "Bash(gh run view:*)", "Bash(gh run rerun:*)"]

# Owner or owner/repo to area id. A repo entry beats its owner's.
[github.areas]
# "my-org" = "work"
# "me/side-project" = "projects"

# Calendars become meetings on Today, alerted before they start. Use each calendar's private iCal
# link (Google: Settings > your calendar > "Secret address in iCal format"). Hide or re-file any
# event in Bridge and the next sync keeps it that way.
[calendar]
poll_minutes = 15
days_ahead = 14
ignore_all_day = true
# Skip events whose title contains any of these.
ignore_titles = []

# [[calendar.feeds]]
# name = "work"
# url = "https://calendar.google.com/calendar/ical/.../basic.ics"
# area = "work"
# ignore_titles = ["Lunch"]

# The on-top countdown before each meeting, with a chime.
[alerts]
enabled = true
lead_minutes = 5
linger_minutes = 3

# Other machines running Bridge. Each serves its own data on `port` (localhost only); expose it
# with a tunnel you run (Tailscale, ngrok, ssh -L) and add it as a peer on the other machine.
# Areas whose `node` is a peer show that machine's data here, and edits go back to it.
[sync]
enabled = false
port = 4791
# Peers must send this. Made on first start when empty.
token = ""

# [[sync.peers]]
# name = "home-mac"
# url = "https://home-mac.your-tailnet.ts.net:4791"
# token = "the token from home-mac's bridge.toml"

# Keeps Claude moving on items it holds. Agents post updates as they go; only an item that goes
# quiet for quiet_minutes gets a check-in (resuming Claude's own session when it registered one),
# at most max_nudges times before Bridge flags it to you instead.
[watchdog]
enabled = true
quiet_minutes = 45
max_nudges = 2
